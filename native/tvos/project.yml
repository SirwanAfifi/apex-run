name: ApexRunTV
options:
  bundleIdPrefix: com.apexrun
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ApexRunTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Runtime/host.js
        buildPhase: resources
      - path: ../../src/motorcycles.js
        buildPhase: resources
      - path: ../../src/coast.js
        buildPhase: resources
      - path: ../../src/london.js
        buildPhase: resources
      - path: ../../src/world-model.js
        buildPhase: resources
      - path: ../../src/collision.js
        buildPhase: resources
      - path: ../../src/race.js
        buildPhase: resources
      - path: ../../src/engine.js
        buildPhase: resources
      - path: ../../dist/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirwanafifi.apexrun
        DEVELOPMENT_TEAM: MD4N52M5TD
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Apex Run
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.racing-games
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Apex Run
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIUserInterfaceStyle: Dark
        GCSupportsControllerUserInteraction: true
        GCSupportsMultipleMicroGamepads: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
          - ProfileName: DirectionalGamepad
        UIAppFonts:
          - assets/BarlowCondensed-ExtraBoldItalic.ttf
  ApexRunTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources: Tests
    dependencies:
      - target: ApexRunTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ApexRunTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: UITests
    dependencies:
      - target: ApexRunTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ApexRunTV:
    build:
      targets:
        ApexRunTV: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ApexRunTVTests
        - ApexRunTVUITests
